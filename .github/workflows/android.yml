# SPDX-License-Identifier: MIT
name: Android release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The release tooling is stdlib-only Python and needs neither the Android SDK nor an APK, so it
  # has no reason to queue behind a Gradle build. Ten tests, seconds to run.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The F-Droid recipe test reads the build file at each release tag, so it fails on a checkout
      # with no tags: "no release tag could be read, so nothing was verified".
      - name: Fetch release tags for the F-Droid recipe check
        run: git fetch --depth=1 origin '+refs/tags/*:refs/tags/*'
      - name: Release tooling tests
        run: python3 -m unittest discover -s tools/tests -v
  # The core module has no Android dependency: `:core:test` configures and runs with no
  # ANDROID_HOME and no local.properties, so these jobs install no SDK packages.
  #
  # `:core:test` is one sequential fork, and where its time goes is measurable from the per-class
  # results it already uploads: 28m57s across 17 classes in run 44916173608. Three of those classes
  # render a whole night of audio and take 23m32s between them — EndlessNightRunTest 11m14s,
  # ThemedNightRunTest 9m47s, NightRunTest 2m30s — while the other 14 classes together are 5m25s.
  # That is why 35 minutes was a coin flip and not a cap: the same commit's `:core:test` took 29m35s
  # in that run and 33m24s in `release.yml`'s run 44916129804, and run 44760169310 was still running
  # at 34m38s when the cap killed it, which turned `release` red and read like a failing test.
  #
  # So the same 119 tests now run in four jobs — the 14 classes that are not Night-category proofs
  # here, and one shard per render proof in `core-night` below — instead of being trimmed to fit a
  # cap. Every class still runs on every pull request.
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      # Measured in both runs of the split (attempts 1 and 2 of run 44923668180): 7m23s and 7m29s of
      # tests, 7m50s and 8m10s of job. Its 14 classes were 5m25s when they ran behind nothing else; now
      # they start beside nine sibling jobs, which is the number that matters. The cap is the worse of
      # the two plus two thirds, the rule `release.yml` uses: 13m36s, taken as 14.
      - name: Core JVM tests, everything that is not an eight-hour render
        run: ./gradlew --no-daemon :core:test -PwithoutNight
      # The count is the part that keeps the split honest rather than nominal. `core-night` deals out
      # whatever carries `@Category(Night::class)` a slice at a time, so it covers every tagged class
      # by construction; this step proves the two halves still add up to the whole module, and fails
      # if a class has appeared that nothing runs.
      - name: Every core test class ran, here or in a Night shard
        run: |
          mapfile -t all < <(
            awk 'FNR == 1 { tagged = 0 }
                 /^(internal |abstract |open )*class [A-Za-z0-9_]+Test[ {(:<]/ {
                   name = $2; sub(/[^A-Za-z0-9_].*/, "", name); print name }' \
              core/src/test/kotlin/dev/nightfall/core/*.kt | sort -u)
          mapfile -t night < <(
            awk 'FNR == 1 { tagged = 0 }
                 /@Category\(Night::class\)/ { tagged = 1; next }
                 /^(internal |abstract |open )*class [A-Za-z0-9_]+Test[ {(:<]/ {
                   if (tagged) { name = $2; sub(/[^A-Za-z0-9_].*/, "", name); print name }
                   tagged = 0 }' core/src/test/kotlin/dev/nightfall/core/*.kt | sort -u)
          expected=$(( ${#all[@]} - ${#night[@]} ))
          ran=$(ls core/build/test-results/test/TEST-*.xml | wc -l)
          echo "$ran of ${#all[@]} core test classes reported results here; ${#night[@]} Night-category classes run in core-night."
          if [ "$ran" -ne "$expected" ]; then
            echo "::error::$expected classes should have run here (${#all[@]} test classes minus ${#night[@]} Night-category) and $ran did. A class that no job runs is a skipped test."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-test-reports-fast
          path: |
            core/build/reports/tests/test/
            core/build/test-results/test/
          retention-days: 14
  # The three Night-category render proofs, one per shard. They are independent of each other and each
  # takes minutes of real rendering, so running them one after another in a single fork is what made
  # `core` long: three jobs run them concurrently and the slowest shard sets the job time instead of
  # the sum of all three.
  #
  # A shard discovers the tagged classes from the sources rather than naming them, then takes every
  # (index mod shard count) of the sorted list. Naming them here would mean a new Night-category test
  # that no job mentions, and it would run nowhere while every job stayed green; dealing out the
  # discovered list cannot miss one. At three tagged classes each shard currently holds exactly one.
  core-night:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Deal this shard its share of the Night-category classes
        id: share
        run: |
          mapfile -t night < <(
            awk 'FNR == 1 { tagged = 0 }
                 /@Category\(Night::class\)/ { tagged = 1; next }
                 /^(internal |abstract |open )*class [A-Za-z0-9_]+Test[ {(:<]/ {
                   if (tagged) { name = $2; sub(/[^A-Za-z0-9_].*/, "", name); print "dev.nightfall.core." name }
                   tagged = 0 }' core/src/test/kotlin/dev/nightfall/core/*.kt | sort)
          if [ "${#night[@]}" -eq 0 ]; then
            echo '::error::No test class carries @Category(Night::class), so these shards have nothing to run and the split is broken.'
            exit 1
          fi
          flags=""
          names=""
          for i in "${!night[@]}"; do
            if [ $(( i % ${{ strategy.job-total }} )) -eq $(( ${{ matrix.shard }} - 1 )) ]; then
              names="$names ${night[$i]}"
              flags="$flags --tests ${night[$i]}"
            fi
          done
          if [ -z "$flags" ]; then
            echo 'empty=true' >> "$GITHUB_OUTPUT"
            echo "Shard ${{ matrix.shard }} of ${{ strategy.job-total }} has no class with ${#night[@]} Night-category classes; it has nothing to run."
            exit 0
          fi
          echo 'empty=false' >> "$GITHUB_OUTPUT"
          echo "tests=$flags" >> "$GITHUB_OUTPUT"
          echo "Shard ${{ matrix.shard }} of ${{ strategy.job-total }} runs:$names"
      # Measured in three runs of the split: the slowest shard is ThemedNightRunTest at 9m25s, 9m17s
      # and 10m19s of job. The cap is the worst of those plus two thirds, as in `release.yml`:
      # 17m12s, taken as 18. The 10m19s run was a slow one all round — `unit` took 9m27s and `api36`
      # 11m17s in it — which is the case a cap has to cover rather than the median.
      #
      # `$TESTS` is deliberately unquoted: it is a string of `--tests <class>` pairs built above, and
      # word splitting is what turns it back into Gradle arguments.
      - name: Core night render tests
        if: steps.share.outputs.empty != 'true'
        env:
          TESTS: ${{ steps.share.outputs.tests }}
        run: ./gradlew --no-daemon :core:test $TESTS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-test-reports-night-${{ matrix.shard }}
          path: |
            core/build/reports/tests/test/
            core/build/test-results/test/
          retention-days: 14
  # `release` needs this name to mean "every core test passed", and it meant that before the split, so
  # it is the four jobs above aggregated rather than a test runner of its own. Same shape as `release`
  # below: it fails, rather than being skipped, when a job it needs did not succeed.
  core:
    needs: [core-tests, core-night]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every core test job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          FAILED=$(printf '%s' "$RESULTS" | python3 -c 'import json,sys; print(" ".join(sorted(k for k,v in json.load(sys.stdin).items() if v["result"] != "success")))')
          if [ -n "$FAILED" ]; then
            echo "::error::These core test jobs did not succeed: $FAILED"
            exit 1
          fi
          echo "core-tests and every core-night shard succeeded"
  # Both channels' scenarios, on the API 35 sandbox that ships. This is also where the store
  # screenshots are rendered, so they upload from here.
  #
  # One job per channel, because the two together no longer fit one cap. Measured on attempt 2 of
  # run 45416594561: 29s of fixed setup (23:02:05 -> 23:02:34), then a single 19m31s Gradle step for
  # both channels, whose uploaded results attribute 7.9 min of tests to `github` and 6.4 min to
  # `fdroid` — the rest is configuration and two variant compilations. That step finished with
  # `BUILD SUCCESSFUL` and the 20-minute cap killed the job 0.36s later, so the cap had become the
  # job's runtime rather than its bound. Split, each job pays 29s of setup, its own variant's compile
  # (at most half of the measured 5m12s of configure-and-compile) and its own channel's tests:
  # 0.5 + 3.3 + 7.9 = 11.7 min for the slower channel, two thirds of headroom over that is 19.5,
  # taken as 20. Re-derive from two measured runs of the split, per the rule this file follows.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: github
            task: testGithubDebugUnitTest
          - flavour: fdroid
            task: testFdroidDebugUnitTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: App unit tests, ${{ matrix.flavour }} channel
        run: ./gradlew --no-daemon :app:${{ matrix.task }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: app-test-reports-${{ matrix.flavour }}
          path: |
            app/build/screenshots/
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
  # `android.yml`'s `release` aggregator and branch protection both name `unit`, and it has meant
  # "both channels' unit tests passed" since before the split, so it stays as an aggregator over the
  # two jobs above, the same shape `core` uses over `core-tests` and `core-night`.
  unit:
    needs: unit-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every app unit test job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          FAILED=$(printf '%s' "$RESULTS" | python3 -c 'import json,sys; print(" ".join(sorted(k for k,v in json.load(sys.stdin).items() if v["result"] != "success")))')
          if [ -n "$FAILED" ]; then
            echo "::error::These app unit test jobs did not succeed: $FAILED"
            exit 1
          fi
          echo "unit-tests passed for both channels"
  # `lintDebug` compiles the debug variant, and `assembleDebug` packages what that compilation
  # already produced, so the build gate's APK costs one more task here rather than a whole job.
  # lint `abortOnError = true` makes this a gate, not advice.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Assemble the debug APK and lint it
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint-and-debug-build
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            app/build/reports/lint-results-*.xml
            app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
  # Both release APKs are built and validated in one job, so `check_release.py` reads the APKs this
  # job just produced rather than downloading them from another one. It needs the release tags: the
  # F-Droid recipe block for a new release is checked against the build file at each tag.
  release-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Fetch release tags for the F-Droid recipe check
        run: git fetch --depth=1 origin '+refs/tags/*:refs/tags/*'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Assemble both channels' unsigned release APKs
        run: ./gradlew --no-daemon :app:assembleGithubRelease :app:assembleFdroidRelease
      - name: Validate store metadata, bundled audio and both channels
        run: python3 tools/check_release.py --apk app/build/outputs/apk/github/release/app-github-release-unsigned.apk --fdroid-apk app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-apks
          path: app/build/outputs/apk/*/release/*.apk
          retention-days: 14
  # The check named `release` is the one that existed before this workflow was split, and branch
  # protection may require it by name. It still means "everything above is green": it fails, rather
  # than being skipped, when any of the jobs it needs did not succeed.
  release:
    needs: [tools, core, unit, lint, release-apks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check above passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          FAILED=$(printf '%s' "$RESULTS" | python3 -c 'import json,sys; print(" ".join(sorted(k for k,v in json.load(sys.stdin).items() if v["result"] != "success")))')
          if [ -n "$FAILED" ]; then
            echo "::error::These jobs did not succeed: $FAILED"
            exit 1
          fi
          echo "tools, core, unit, lint and release-apks all succeeded"
  # The same app unit tests, on Android 16's own platform runtime. Robolectric's API 36 sandbox
  # refuses to start on the Temurin 17 that `release` and the F-Droid recipe build with ("Android SDK
  # 36 requires Java 21"), so `unit` runs the suite on the API 35 sandbox with a 36 target and this
  # job is the only place the behaviour targeting 36 turns on is executed rather than read: predictive
  # back reported through OnBackInvokedDispatcher, and edge-to-edge insets on a 36 window. It runs the
  # app unit tests only — no APK assemblies, no lint — restores the same Gradle cache as `unit`,
  # and nothing depends on it.
  api36:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: App unit tests on the API 36 runtime
        run: ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:testFdroidDebugUnitTest -PnightfallRobolectricSdk=36
      # The two Android 16 assertions skip themselves below API 36, so a job that lost the sandbox
      # property would still be green while measuring nothing. Fail instead.
      - name: The Android 16 assertions ran, rather than skipping
        run: |
          for flavour in github fdroid; do
            report="app/build/test-results/test${flavour^}DebugUnitTest/TEST-dev.nightfall.Android16RuntimeTest.xml"
            grep -q 'tests="2" skipped="0" failures="0"' "$report" || {
              echo "$report did not run both Android 16 assertions on the API 36 runtime"; exit 1; }
            echo "$report: 2 tests, 0 skipped"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: api36-test-reports
          path: app/build/reports/tests/
          retention-days: 7
