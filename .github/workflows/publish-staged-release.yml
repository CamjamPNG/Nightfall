# SPDX-License-Identifier: MIT
name: Publish already signed APKs
on:
  push:
    branches: ['release-assets/v*']
permissions:
  contents: write
concurrency:
  group: nightfall-staged-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pre-signed public assets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          TAG="${GITHUB_REF_NAME#release-assets/}"
          python3 tools/verify_release.py --assets release-upload --tag "$TAG"
      - name: Publish complete release
        run: |
          TAG="${GITHUB_REF_NAME#release-assets/}"
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$DRAFT" = false ]; then
            echo 'Already published; existing assets are unchanged.'
          else
            if [ "$DRAFT" != true ]; then
              gh release create "$TAG" --verify-tag --draft --title "Nightfall ${TAG#v}" --notes-file release-upload/release-notes.md
            fi
            gh release upload "$TAG" --clobber release-upload/*.apk release-upload/SHA256SUMS.txt release-upload/release-manifest.json release-upload/nightfall-release-certificate.pem
            gh release view "$TAG" --json assets > "$RUNNER_TEMP/uploaded.json"
            python3 - <<'PY'
          import json, os, pathlib
          expected = {p.name: p.stat().st_size for p in pathlib.Path('release-upload').iterdir() if p.name != 'release-notes.md'}
          actual = {a['name']: a['size'] for a in json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'uploaded.json').read_text())['assets']}
          assert actual == expected, 'Incomplete release; keeping draft'
          PY
            gh release edit "$TAG" --draft=false --latest
          fi
      - name: Remove completed temporary asset branch
        run: git push origin --delete "$GITHUB_REF_NAME"
