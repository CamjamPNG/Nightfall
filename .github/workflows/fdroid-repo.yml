# SPDX-License-Identifier: MIT
name: Publish the Nightfall site
on:
  release:
    types: [published]
  workflow_run:
    # Releases published by the repository's own workflows use GITHUB_TOKEN,
    # and GitHub does not start workflows for events that token creates, so a
    # release event alone would never reach here. Both publishers are followed.
    workflows: [Publish Android release, Publish already signed APKs]
    types: [completed]
  push:
    # The landing page is one part of the same artifact, so editing it deploys here rather than
    # from a workflow of its own; two publishers would overwrite each other on one Pages site.
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/fdroid-repo.yml'
  workflow_dispatch:
    inputs:
      releases:
        description: Recent releases to index
        default: '2'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nightfall-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Download the published APKs
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ inputs.releases || '2' }}
        run: |
          # Only the F-Droid flavour may enter the index, so the picker accepts one name and has
          # no fallback: any other APK would be the update channel's, which declares INTERNET.
          # A release published before that asset existed carries none and cannot be indexed, so it
          # is skipped by name rather than mistaken for a broken release; the release pipeline
          # refuses to publish without the asset, so a skip can only be history.
          mkdir -p "$RUNNER_TEMP/apks"
          : > "$RUNNER_TEMP/apks/list"
          SKIPPED=""
          for TAG in $(gh release list --limit "$RELEASES" --exclude-drafts --json tagName --jq '.[].tagName'); do
            NAMES=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            ASSET=$(printf '%s\n' "$NAMES" | grep -iE '(^|[-_.])fdroid([-_.]|$)' | grep -i universal | head -1)
            if [ -z "$ASSET" ]; then
              echo "::warning::$TAG publishes no Nightfall-<version>-fdroid-universal.apk, so there is nothing in it that may enter this index; skipping it"
              SKIPPED="$SKIPPED $TAG"
              continue
            fi
            echo "$TAG -> $ASSET"
            mkdir -p "$RUNNER_TEMP/apks/$TAG"
            gh release download "$TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP/apks/$TAG" --clobber
            find "$RUNNER_TEMP/apks/$TAG" -name '*.apk' >> "$RUNNER_TEMP/apks/list"
          done
          if [ -s "$RUNNER_TEMP/apks/list" ]; then
            echo 'indexable=true' >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/apks/list"
          else
            # No release in the window carries one yet. The site still deploys, without a
            # repository beneath it; the first release that publishes the asset builds one.
            echo "::warning::No release in the requested window publishes an F-Droid-channel APK, so this deploy carries the landing page alone. Skipped:${SKIPPED:- none}."
            echo 'indexable=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check the repository signing key
        if: steps.pick.outputs.indexable == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo '::error::Add FDROID_REPO_KEYSTORE_BASE64 and FDROID_REPO_KEYSTORE_PASSWORD in repository Actions secrets. See docs/FDROID.md. The index will never be published unsigned.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fdroid-repo.p12"
          echo "FDROID_REPO_KEYSTORE=$RUNNER_TEMP/fdroid-repo.p12" >> "$GITHUB_ENV"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.pick.outputs.indexable == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fdroidserver
        if: steps.pick.outputs.indexable == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check fdroidserver==2.4.5
          echo "FDROID_BIN=$RUNNER_TEMP/venv/bin/fdroid" >> "$GITHUB_ENV"
      - name: Install apksigner
        if: steps.pick.outputs.indexable == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Generate and verify the signed index
        if: steps.pick.outputs.indexable == 'true'
        env:
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
        run: |
          ARGS=()
          while read -r APK; do ARGS+=(--apk "$APK"); done < "$RUNNER_TEMP/apks/list"
          "$RUNNER_TEMP/venv/bin/python" tools/fdroid_repo.py build "${ARGS[@]}" \
            --out "$RUNNER_TEMP/fdroid" --keep 2 --summary "$RUNNER_TEMP/fdroid-index.json"
      - name: Assemble the single Pages artifact
        env:
          INDEXABLE: ${{ steps.pick.outputs.indexable }}
        run: |
          if [ "$INDEXABLE" = "true" ]; then
            python3 tools/assemble_site.py --repo "$RUNNER_TEMP/fdroid/repo" \
              --summary "$RUNNER_TEMP/fdroid-index.json" --out site
          else
            python3 tools/assemble_site.py --out site
          fi
          du -sh site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
