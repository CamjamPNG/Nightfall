# 4 GiB heap: a release job dexes both flavours (github and fdroid), and D8 merges the
# fdroid variant in the same daemon. R8 minification, queued separately, will cut it.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official

# Maven Central hands 429 Too Many Requests to shared CI addresses in bursts. Gradle already treats
# 429 as transient and retries repository access with a doubling backoff, but its defaults are 3
# tentatives starting at 1s — 3s of waiting in total — and two runs on 2026-11-23 ran out of them:
# #57 lost the `core-night (1)` shard to a concentus fetch and passed unchanged on re-run, and the
# v2.7 publish run failed in `core` with 30 unresolvable Android Gradle Plugin transitives
# (slf4j-api, jdom2, javawriter, jsr305 and the rest) after its first 429.
#
# Six tentatives from 5s gave a burst 5 + 10 + 20 + 40 + 80 = 155s to clear, and on 2026-11-28 a
# burst outlasted that too. `core-night (3)` on #63 spent 630s between the Gradle step starting and
# its first task line, then 280s inside `:core:compileTestKotlin`, and failed on a single
# `io.github.jaredmdobson:concentus:1.0.2` POM: 429 again. The other three core jobs of that commit,
# restoring the same dependency cache, reached `:core:test` in 66-73s. So the retry ran — a 429 that
# is not retried fails a task in seconds, and this job took 15m51s — and the burst was longer than
# the budget. Seven tentatives from 5s give 5 + 10 + 20 + 40 + 80 + 160 = 315s per fetch, measured
# against a local server that answers 429 forever.
#
# The extra 160s is what this setting costs: a fetch that ends in a 429 failure either way waits it
# out first. `org.gradle.workers.max=2` runs two resolutions at a time, but one unresolvable module
# can be attempted twice — measured in CI, and the 630s of configuration above is about four of the
# old budgets — so a burst can cost a job 630s rather than 315s. The tightest Gradle cap in
# `android.yml` is `core-tests` at 14 minutes against a job that measured 8m10s when #60 sized it and
# 10m01s on 2026-11-28: four to six minutes of headroom, so one round fits and two do not. At 155s
# two rounds did not fit either, so this puts that job one round away from a burst ending in a
# cancellation rather than a red failure. 315s is the ceiling rather than a step towards something
# larger: a job that waits five minutes for a fetch has stopped being useful, and a failure that slow
# is better reported than absorbed.
#
# These are the only knobs Gradle 8.11.1 has for this — `org.gradle.internal.repository.*`, read as
# JVM system properties by ErrorHandlingModuleComponentRepository — so `systemProp.` is what puts them
# in the build JVM. Local builds get the same behaviour as CI.
#
# This is not a flake suppressor. Exhausting the retries is still a hard failure: the build goes red
# with the 429 in it, as it did before. A missing artifact is a 404 and is never retried at all, and
# nothing here re-runs a task or a test. The budget belongs to each fetch, not to the build. Raise
# the numbers only with a measurement of the extra wait they cost.
systemProp.org.gradle.internal.repository.max.tentatives=7
systemProp.org.gradle.internal.repository.initial.backoff=5000
