MaintainerNotes: |
  Original code is MIT. The commercial-courtesy request is voluntary and
  adds no license restriction. Bundled non-executable recordings retain
  their CC BY, CC BY-SA or CC0 terms; see AUDIO_LICENSES.md and sidecars.

  Flavor migration: every block above pins a tag from before the github/fdroid
  product flavors existed, so they keep "gradle: [yes]", which builds the single
  offline release variant with no network permission, and they must not be
  switched. A block pinned to a pre-flavor tag would have no
  assembleFdroidRelease task to run. Use "gradle: [fdroid]" only for a tag whose
  app/build.gradle.kts defines that flavor. tools/release_version.py writes new
  blocks, so its template must emit the flavor from the first release that has
  it. See docs/FDROID.md.

  New application: development-age or proven-user policy eligibility has
  not been demonstrated. No inclusion exception or hardware certification
  is claimed. See fdroid/README.md and docs/TESTING.md before submission.

  The old development APK used dev.nightfall. This initial public package
  uses the developer's GitHub namespace and is built unsigned for F-Droid.
  No upstream production signing reference has been configured.

